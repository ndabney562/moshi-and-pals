<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the game draw under the notch; we keep HUD inside safe areas in code. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moshi &amp; Pals" />
    <meta name="theme-color" content="#0d2b2e" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" href="icons/icon-192.png?v=2" />
    <meta name="description" content="Clock in, pick your Pal, and survive a clinic full of germs. Play Moshi and Pals free in your browser, online or offline." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Moshi and Pals" />
    <meta property="og:description" content="Four Pals. One chaotic clinic. Clock in for a free, touch-first survival game." />
    <meta property="og:url" content="https://ndabney562.github.io/moshi-and-pals/" />
    <meta property="og:image" content="https://ndabney562.github.io/moshi-and-pals/social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Moshi and Pals clinic survival game, featuring the original game poster" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://ndabney562.github.io/moshi-and-pals/" />
    <title>Moshi and Pals</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #0d2b2e; overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { height: 100dvh; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; }
      canvas { touch-action: none; display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px;
        color: #e8fff9; font: 600 18px system-ui, sans-serif; text-align: center; pointer-events: none; }
      #loading strong { color: #7fffd4; font-size: 26px; }
      #loading[hidden] { display: none; }
      /* Invisible probe: lets the game read iPhone safe-area insets (notch / home bar). */
      #safe-area-probe {
        position: fixed; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* Phones held upright: src/core/orientation.ts sizes #game sideways and this turns it to fill the screen. */
      body.portrait #game { right: auto; bottom: auto; top: 0; transform-origin: top left; transform: rotate(90deg); }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite"><strong>Moshi and Pals</strong><span>Scrubbing in…</span></div>
    <div id="game" role="application" aria-label="Moshi and Pals. Move with the left thumb, spray with the right. Arrow keys and Space also work."></div>
    <noscript>This game needs JavaScript enabled in your browser.</noscript>
    <div id="safe-area-probe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
