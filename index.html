<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the game draw under the notch; we keep HUD inside safe areas in code. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moshi" />
    <meta name="theme-color" content="#0d2b2e" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Moshi and Pals</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #0d2b2e; overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      /* Invisible probe: lets the game read iPhone safe-area insets (notch / home bar). */
      #safe-area-probe {
        position: fixed; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* Shown on phones held in portrait. Safari can't lock orientation, so we ask nicely. */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #0d2b2e; color: #e8fff9;
        font: 600 20px/1.4 -apple-system, system-ui, sans-serif;
        align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      #rotate .phone { font-size: 56px; display: block; margin-bottom: 12px; animation: tilt 1.6s ease-in-out infinite; }
      @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-area-probe"></div>
    <div id="rotate"><div><span class="phone">📱</span>Turn your phone sideways.<br />Dr. Moshkovich does not work in portrait.</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
