name: CI

on:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Phone-sized touch test of the built game, using the runner's Chrome
      - run: npm run smoke
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
